name: Deploy to KingHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP to KingHost
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.KINGHOST_FTP_SERVER }}
          username: ${{ secrets.KINGHOST_FTP_USERNAME }}
          password: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.KINGHOST_FTP_SERVER_DIR }}
          log-level: verbose
          dangerous-clean-slate: true
